name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            .wrangler/deploy
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: dist }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  deploy-preview:
    name: deploy-preview
    # Deploys stay off until the repo variable DEPLOY_ENABLED=true (set once Cloudflare secrets exist).
    # Same-repo PRs only: fork PRs never receive secrets.
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, test, e2e]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: dist }
      - id: upload
        name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://pr-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          test -n "$url" || { echo "::error::Preview URL not found in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test preview
        run: |
          pnpm exec playwright install --with-deps chromium
          BASE_URL="${{ steps.upload.outputs.url }}" pnpm test:e2e
      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n🔎 Preview: ${{ steps.upload.outputs.url }} (commit ${context.sha.slice(0, 7)})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  deploy-production:
    name: deploy-production
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency: { group: production, cancel-in-progress: false }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: dist }
      - name: Deploy
        run: pnpm exec wrangler deploy --message "main @ ${GITHUB_SHA::7}"
      - name: Smoke test production
        id: smoke
        # PRODUCTION_URL is the workers.dev URL until the custom domain goes live in M4.
        run: |
          pnpm exec playwright install --with-deps chromium
          BASE_URL="${{ vars.PRODUCTION_URL }}" pnpm test:e2e
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          pnpm exec wrangler rollback --yes --message "Auto-rollback - smoke test failed for ${GITHUB_SHA::7}"
