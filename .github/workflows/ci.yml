name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      drill_rollback:
        description: 'Rollback drill: deploy, then fail the smoke test on purpose so auto-rollback runs'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  changes:
    name: changes
    # Which suites a PR can affect. Skipped jobs count as passing required checks. Pushes to main and
    # manual runs always run everything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lead: ${{ steps.filter.outputs.lead }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            printf 'code=true\nlead=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh pr diff "$PR" -R "${{ github.repository }}" --name-only)
          # Docs-only: nothing to build or run. Content-only: can't reach the lead flow.
          docs='^(docs/|\.claude/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'
          content='^(src/content/|src/data/|public/)'
          code=false; lead=false
          [ -z "$files" ] && { code=true; lead=true; }
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [[ $f =~ $docs ]] || code=true
            if [[ $f == src/data/lead.ts ]] || ! [[ $f =~ $docs || $f =~ $content ]]; then lead=true; fi
          done <<< "$files"
          echo "code=$code lead=$lead"
          printf 'code=%s\nlead=%s\n' "$code" "$lead" >> "$GITHUB_OUTPUT"

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      # The build prints /resume to resume.pdf with Chromium.
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            .wrangler/deploy
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: e2e
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - uses: actions/download-artifact@v8
        with: { name: dist }
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  e2e-lead:
    name: e2e-lead
    # The lead flow end to end (form → /api/lead → local D1 → queue) on a local staging build with a
    # throwaway D1 and no real secrets, so it never touches the real Sheet, inbox or Telegram.
    needs: changes
    if: needs.changes.outputs.lead == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - run: pnpm test:lead
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-report-lead, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: lighthouse
    # Audits the built Worker locally: workers.dev previews send noindex on purpose, which would fail SEO.
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      - uses: actions/download-artifact@v8
        with: { name: dist }
      - run: pnpm lighthouse

  deploy-preview:
    name: deploy-preview
    # Deploys stay off until the repo variable DEPLOY_ENABLED=true (set once Cloudflare secrets exist).
    # Same-repo PRs only: fork PRs never receive secrets.
    # Runs when e2e-lead was skipped (content-only PR), never when any gate failed.
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      needs.e2e.result == 'success' && needs.lighthouse.result == 'success' &&
      vars.DEPLOY_ENABLED == 'true' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, test, e2e, e2e-lead, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with: { playwright: 'true' }
      # Previews run on the staging Worker (own D1, queue and secrets; ADR 006). The adapter picks the
      # Cloudflare environment at build time, so this job builds for staging instead of reusing `dist`.
      - run: pnpm build
        env: { CLOUDFLARE_ENV: staging }
      - id: upload
        name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://pr-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          test -n "$url" || { echo "::error::Preview URL not found in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          version=$(echo "$out" | grep -oE 'Worker Version ID: [0-9a-f-]+' | awk '{print $4}')
          test -n "$version" || { echo "::error::Version ID not found in wrangler output"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Queue consumers and crons only run on the deployed version, never on preview versions. Deploying
      # the PR's version to all of staging lets it exercise lead delivery end to end (ADR 006).
      - name: Apply migrations and deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply DB --env staging --remote
          pnpm exec wrangler versions deploy "${{ steps.upload.outputs.version }}@100%" --yes --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}"
      - name: Smoke test preview
        run: BASE_URL="${{ steps.upload.outputs.url }}" pnpm test:e2e
      - name: Comment preview URL
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n🔎 Preview: ${{ steps.upload.outputs.url }} (commit ${context.sha.slice(0, 7)})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  deploy-production:
    name: deploy-production
    # Runs on pushes to main, or manually (Actions → CI/CD → Run workflow) on main.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, test, e2e, e2e-lead, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency: { group: production, cancel-in-progress: false }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with: { name: dist }
      # Before the deploy, so new code never runs against an old schema. Migrations only add things
      # (ADR 003): a rollback reverts code, not schema, and the previous version must still work.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - id: deploy
        name: Deploy
        # Smoke-test PRODUCTION_URL once the custom domain is live (M4); until then use the
        # workers.dev URL that wrangler prints.
        run: |
          out=$(pnpm exec wrangler deploy --message "main @ ${GITHUB_SHA::7}" 2>&1 | tee /dev/stderr)
          url="${{ vars.PRODUCTION_URL }}"
          if [ -z "$url" ]; then
            url=$(echo "$out" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          fi
          test -n "$url" || { echo "::error::Deployed URL not found in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test production
        id: smoke
        run: |
          pnpm exec playwright install --with-deps chromium
          BASE_URL="${{ steps.deploy.outputs.url }}" pnpm test:e2e
          if [ "${{ inputs.drill_rollback }}" = "true" ]; then
            echo "::warning::Rollback drill: failing the smoke test on purpose"
            exit 1
          fi
      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          pnpm exec wrangler rollback --yes --message "Auto-rollback - smoke test failed for ${GITHUB_SHA::7}"
