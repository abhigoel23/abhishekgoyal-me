name: Setup
description: pnpm, Node from .nvmrc, frozen install and, optionally, a cached Playwright Chromium.
inputs:
  playwright:
    description: Install Playwright Chromium (browser cached by Playwright version; system deps always installed)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with: { node-version-file: .nvmrc, cache: pnpm }
    - run: pnpm install --frozen-lockfile
      shell: bash
    - id: pw
      if: inputs.playwright == 'true'
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: pw-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - if: inputs.playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - if: inputs.playwright == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium
      shell: bash
